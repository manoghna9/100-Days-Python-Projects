{% extends "base.html" %}

{% block title %}
Register | ByteCart
{% endblock %}


{% block content %}

<div class="auth-box">

    <p class="eyebrow">
        CREATE ACCOUNT
    </p>

    <h1>
        Join ByteCart
    </h1>

    <form method="POST">

        <label>
            Name
        </label>

        <input
            type="text"
            name="name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Log in
        </a>
    </p>

</div>

{% endblock %}
