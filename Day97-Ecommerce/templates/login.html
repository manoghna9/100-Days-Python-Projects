{% extends "base.html" %}

{% block title %}
Login | ByteCart
{% endblock %}


{% block content %}

<div class="auth-box">

    <p class="eyebrow">
        WELCOME BACK
    </p>

    <h1>
        Log in
    </h1>

    <form method="POST">

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Log In
        </button>

    </form>

    <p>
        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>
    </p>

</div>

{% endblock %}
